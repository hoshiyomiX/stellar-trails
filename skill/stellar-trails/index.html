<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>stellar-trails</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:#050714;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  /* Static star field — box-shadow trick (single paint, no animation) */
  .stars{
    position:fixed;top:0;left:0;width:1px;height:1px;z-index:0;
    box-shadow:
      50px 80px #fff, 150px 200px rgba(255,255,255,.6), 300px 100px #fff,
      450px 300px rgba(255,255,255,.4), 600px 150px rgba(167,139,250,.6),
      700px 50px #fff, 200px 400px rgba(34,211,238,.4), 850px 250px #fff,
      100px 500px rgba(255,255,255,.5), 350px 550px #fff, 550px 450px rgba(251,113,133,.3),
      750px 500px rgba(255,255,255,.6), 900px 400px #fff, 250px 600px rgba(167,139,250,.4),
      500px 650px rgba(255,255,255,.5), 650px 600px #fff, 800px 550px rgba(34,211,238,.3),
      120px 350px #fff, 420px 120px rgba(255,255,255,.4), 680px 380px #fff,
      50px 700px rgba(255,255,255,.3), 950px 600px #fff, 380px 680px rgba(167,139,250,.5),
      580px 720px rgba(255,255,255,.4), 880px 100px #fff, 150px 750px rgba(34,211,238,.3);
  }

  /* Nebula glow — static, no animation */
  .nebula{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 600px 400px at 50% 40%,rgba(139,92,246,.08),transparent 70%),
      radial-gradient(ellipse 400px 300px at 30% 70%,rgba(236,72,153,.05),transparent 70%);
  }

  /* Center content */
  .center{position:relative;z-index:1;text-align:center;animation:fadeUp .4s ease-out}
  @keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

  .mascot{
    width:180px;height:auto;max-height:200px;
    margin:0 auto 1rem;display:block;
    filter:drop-shadow(0 0 30px rgba(139,92,246,.25));
    animation:float 4s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  h1{
    font-size:1.4rem;font-weight:600;color:#fff;letter-spacing:-.01em;
    margin-bottom:.2rem;
  }
  .ver{
    font-size:.65rem;color:#a78bfa;letter-spacing:.05em;
    margin-bottom:.5rem;font-family:'SF Mono',Monaco,monospace;
  }
  .sub{font-size:.7rem;color:#8892a8;letter-spacing:.05em;margin-bottom:1.2rem}

  /* Skill() quick-copy — primary action */
  .cmd{
    font-family:'SF Mono',Monaco,monospace;
    font-size:.72rem;color:#4a5268;cursor:pointer;
    display:inline-flex;align-items:center;gap:.4rem;
    padding:.5rem .9rem;border:1px solid rgba(255,255,255,.08);border-radius:8px;
    transition:border-color .2s,background .2s;
  }
  .cmd:hover{border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.05)}
  .cmd .p{color:#a78bfa}
  .cmd .h{color:#2dd4bf}
  .cmd .ok{color:#2dd4bf;opacity:0;transition:opacity .3s;font-size:.6rem;margin-left:.3rem}
  .cmd.done .ok{opacity:1}
</style>
</head>
<body>
<div class="stars"></div>
<div class="nebula"></div>

<div class="center">
  <img class="mascot" src="chibi.svg" alt="stellar-trails"
       onerror="this.style.display='none'">
  <div class="ver">v9.16.1</div>
  <h1>stellar-trails</h1>
  <div class="sub">six-phase workflow</div>
  <div class="cmd" onclick="copyCmd(this)">
    <span class="p">Skill</span>(command=<span class="h">"stellar-trails"</span>)
    <span class="ok">✓ copied</span>
  </div>
</div>

<script>
function copyCmd(el){
  navigator.clipboard.writeText('Skill(command="stellar-trails")').then(()=>{
    el.classList.add('done');
    setTimeout(()=>el.classList.remove('done'),1500);
  });
}
</script>
</body>
</html>
